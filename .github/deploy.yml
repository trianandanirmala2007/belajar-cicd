
name: CI-CD Landing Page

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Mengambil kode dari GitHub
        uses: actions/checkout@v6

      - name: Memeriksa file website
        run: |
          test -f index.html
          grep -qi "<html" index.html
          echo "Pemeriksaan file berhasil"

      - name: Mengatur GitHub Pages
        uses: actions/configure-pages@v5

      - name: Mengunggah file website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
